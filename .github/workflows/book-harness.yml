name: book-harness

on:
  push:
    branches: [main]
    paths:
      - "book/harness/**"
      - ".github/workflows/book-harness.yml"
  pull_request:
    paths:
      - "book/harness/**"
      - ".github/workflows/book-harness.yml"

permissions:
  contents: read

jobs:
  test:
    name: offline test + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: book/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/harness/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
