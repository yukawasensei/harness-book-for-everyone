name: 书稿勘误 / Erratum
description: 报告书稿文字、图解或链接错误 / Report a book text, diagram, or link error
title: "[勘误 / Erratum] "
labels: ["erratum"]
body:
  - type: input
    id: chapter
    attributes:
      label: 章节 · Chapter
      description: "例如 ch05.md、appendix-pm-checklist.md · e.g. ch05.md, appendix-pm-checklist.md"
      placeholder: "ch05.md"
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 原文 · Original text
      description: 有问题的原文或图注 · the incorrect passage or caption
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议 · Suggested fix
      description: 建议改成什么 · what it should say instead
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由 · Reason
      description: 为何原文有误、依据是什么 · why the original is wrong and what evidence you have
    validations:
      required: true
